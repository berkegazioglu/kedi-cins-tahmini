<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Cat face -->
  <circle cx="20" cy="22" r="14" fill="url(#g)"/>
  <!-- Ears -->
  <polygon points="8,12 4,2 14,10" fill="url(#g)"/>
  <polygon points="32,12 36,2 26,10" fill="url(#g)"/>
  <!-- Inner ears -->
  <polygon points="9,11 6,4 13,9" fill="#fce7f3"/>
  <polygon points="31,11 34,4 27,9" fill="#fce7f3"/>
  <!-- Eyes -->
  <ellipse cx="15" cy="20" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="25" cy="20" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="15" cy="20" rx="1.2" ry="2" fill="#1e1b4b"/>
  <ellipse cx="25" cy="20" rx="1.2" ry="2" fill="#1e1b4b"/>
  <!-- Nose -->
  <polygon points="20,25 18.5,27 21.5,27" fill="#fda4af"/>
  <!-- Mouth -->
  <path d="M18.5 27 Q17 29 16 28" stroke="#fda4af" stroke-width="0.8" fill="none"/>
  <path d="M21.5 27 Q23 29 24 28" stroke="#fda4af" stroke-width="0.8" fill="none"/>
  <!-- Whiskers -->
  <line x1="6" y1="25" x2="15" y2="26" stroke="white" stroke-width="0.7" opacity="0.8"/>
  <line x1="6" y1="27" x2="15" y2="27" stroke="white" stroke-width="0.7" opacity="0.8"/>
  <line x1="34" y1="25" x2="25" y2="26" stroke="white" stroke-width="0.7" opacity="0.8"/>
  <line x1="34" y1="27" x2="25" y2="27" stroke="white" stroke-width="0.7" opacity="0.8"/>
</svg>
