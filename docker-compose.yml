services:
  # FastAPI Backend
  backend:
    build: .
    container_name: kedi-backend
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app/backend
      - ./yolo11n.pt:/app/yolo11n.pt:ro
      - ./optimal_ensemble_final.pth:/app/optimal_ensemble_final.pth:ro
      - ./EfficientNetB0_best.pth:/app/EfficientNetB0_best.pth:ro
      - ./MobileNetV3_best.pth:/app/MobileNetV3_best.pth:ro
      - ./cat_breed_info.json:/app/cat_breed_info.json:ro
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: ["python", "-m", "uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # Frontend (React + Vite)
  frontend:
    image: node:20-alpine
    container_name: kedi-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
